<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>资源导航站</title>
  <style>
    :root{
      --bg:#0f172a;
      --bg2:#111827;
      --card:#111827cc;
      --line:#23314f;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --accent:#60a5fa;
      --accent2:#34d399;
      --warn:#f59e0b;
      --shadow: 0 10px 30px rgba(0,0,0,.25);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, #1e293b 0%, transparent 35%),
        radial-gradient(circle at top right, #0f766e 0%, transparent 25%),
        linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color:var(--text);
      min-height:100vh;
    }

    .container{
      width:min(1280px, calc(100% - 32px));
      margin:0 auto;
      padding:24px 0 48px;
    }

    .hero{
      background: linear-gradient(135deg, rgba(96,165,250,.12), rgba(52,211,153,.08));
      border:1px solid rgba(148,163,184,.18);
      border-radius:24px;
      padding:28px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
    }

    .topbar{
      display:flex;
      gap:16px;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
    }

    .brand h1{
      margin:0;
      font-size:28px;
      line-height:1.2;
    }

    .brand p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .stats{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .stat{
      min-width:140px;
      background: rgba(17,24,39,.72);
      border:1px solid rgba(148,163,184,.16);
      border-radius:16px;
      padding:14px 16px;
    }

    .stat .num{
      font-size:22px;
      font-weight:700;
      color:#fff;
    }

    .stat .label{
      margin-top:4px;
      color:var(--muted);
      font-size:13px;
    }

    .search-wrap{
      margin-top:22px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
    }

    .search-box{
      flex:1;
      min-width:280px;
      display:flex;
      align-items:center;
      gap:10px;
      background: rgba(15,23,42,.85);
      border:1px solid rgba(148,163,184,.18);
      border-radius:16px;
      padding:14px 16px;
    }

    .search-box input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:var(--text);
      font-size:15px;
    }

    .search-box input::placeholder{color:#7c8aa5}

    .btn{
      border:none;
      cursor:pointer;
      padding:14px 18px;
      border-radius:16px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color:white;
      font-weight:600;
      box-shadow:var(--shadow);
    }

    .btn.secondary{
      background: rgba(15,23,42,.9);
      border:1px solid rgba(148,163,184,.18);
      color:var(--text);
      box-shadow:none;
    }

    .section{
      margin-top:28px;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      flex-wrap:wrap;
      gap:12px;
      margin-bottom:14px;
    }

    .section-title{
      margin:0;
      font-size:20px;
    }

    .section-desc{
      color:var(--muted);
      font-size:13px;
    }

    .hot-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:14px;
    }

    .hot-card, .cat-card{
      background: rgba(17,24,39,.78);
      border:1px solid rgba(148,163,184,.16);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .hot-card{
      padding:18px;
      position:relative;
    }

    .hot-badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:12px;
      color:#dbeafe;
      background: rgba(59,130,246,.15);
      border:1px solid rgba(96,165,250,.25);
      padding:6px 10px;
      border-radius:999px;
      margin-bottom:12px;
    }

    .hot-card a{
      color:#fff;
      text-decoration:none;
      font-size:16px;
      font-weight:600;
    }

    .hot-card p{
      margin:10px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    .cats{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
      gap:16px;
    }

    .cat-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 16px 10px;
      border-bottom:1px solid rgba(148,163,184,.12);
    }

    .cat-title{
      margin:0;
      font-size:16px;
    }

    .count{
      color:var(--muted);
      font-size:12px;
    }

    .card-list{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
      gap:10px;
      padding:16px;
    }

    .site{
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:14px;
      background: rgba(15,23,42,.72);
      border:1px solid rgba(148,163,184,.12);
      border-radius:16px;
      text-decoration:none;
      color:var(--text);
      transition:.2s ease;
      min-height:92px;
    }

    .site:hover{
      transform: translateY(-2px);
      border-color: rgba(96,165,250,.45);
      background: rgba(30,41,59,.9);
    }

    .site-name{
      font-weight:600;
      font-size:14px;
    }

    .site-url{
      font-size:12px;
      color:var(--muted);
      word-break:break-all;
    }

    .site small{
      color:var(--accent2);
      font-size:12px;
      margin-top:auto;
    }

    .hidden{display:none !important;}

    footer{
      margin-top:28px;
      color:var(--muted);
      font-size:13px;
      text-align:center;
      padding:18px 0 8px;
    }

    @media (max-width: 640px){
      .hero{padding:18px}
      .brand h1{font-size:22px}
      .stat{min-width:unset; flex:1}
      .btn{width:100%}
      .search-box{min-width:100%}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="topbar">
        <div class="brand">
          <h1>资源导航站</h1>
          <p>卡片式资源导航 · 搜索查找 · 点击统计 · 热门推荐</p>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="num" id="siteCount">0</div>
            <div class="label">收录资源</div>
          </div>
          <div class="stat">
            <div class="num" id="clickCount">0</div>
            <div class="label">总点击次数</div>
          </div>
        </div>
      </div>

      <div class="search-wrap">
        <div class="search-box">
          <span>🔎</span>
          <input id="searchInput" type="text" placeholder="搜索资源：如 AI、电影、工具、字幕、游戏..." />
        </div>
        <button class="btn secondary" id="resetBtn">重置搜索</button>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div>
          <h2 class="section-title">热门推荐</h2>
          <div class="section-desc">根据点击次数自动排序，优先显示常用资源</div>
        </div>
      </div>
      <div class="hot-grid" id="hotGrid"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <div>
          <h2 class="section-title">全部分类</h2>
          <div class="section-desc">搜索后会自动筛选对应资源</div>
        </div>
      </div>
      <div class="cats" id="cats"></div>
    </div>

    <footer>
      这是一个本地可用的导航站首页模板，可自行替换资源、图标、主题色与分类。
    </footer>
  </div>

  <script>
    const data = [
      {
        category: "AI 网站",
        items: [
          { name: "SharedChat", url: "https://sharedchat.fun/", desc: "AI 对话" },
          { name: "ChatOpenS VIP", url: "https://vip.chatopens.vip/", desc: "AI 工具" },
          { name: "AI Apps", url: "https://ai-apps.com.cn", desc: "AI 应用集合" },
          { name: "AI 网站", url: "https://add.lra.cn", desc: "AI 工具入口" }
        ]
      },
      {
        category: "办公 / 平台",
        items: [
          { name: "办公平台", url: "https://duobaoyu.work/platform#", desc: "在线平台" },
          { name: "系统工具", url: "https://www.kdocs.cn/l/cjkZcTNs2vcU", desc: "文档工具" }
        ]
      },
      {
        category: "视频 / 影视 / 下载",
        items: [
          { name: "视频下载", url: "https://www.anytocopy.com/", desc: "视频下载" },
          { name: "推特下载", url: "https://savetwitter.net/zh-cn3", desc: "X/Twitter 下载" },
          { name: "免费电影", url: "https://youkutv.us", desc: "影视资源站" },
          { name: "电视剧", url: "https://kkys01.com", desc: "追剧站" },
          { name: "影视都有", url: "https://gaze.run/", desc: "影视站" },
          { name: "NetflixGC", url: "https://www.netflixgc.com/", desc: "影视资源" }
        ]
      },
      {
        category: "动漫 / 次元",
        items: [
          { name: "动漫", url: "https://www.agedm.io/", desc: "动漫站" },
          { name: "MiFun", url: "https://ios.mifun.org/", desc: "番剧" },
          { name: "次元", url: "https://dimtown.com/", desc: "二次元资源" }
        ]
      },
      {
        category: "设计 / 海报 / 图片",
        items: [
          { name: "海报模板", url: "https://huaban.com/", desc: "灵感/海报" },
          { name: "创客贴", url: "https://www.chuangkit.com/designtools/designindex", desc: "设计工具" },
          { name: "无损放大", url: "https://bigjpg.com", desc: "图片放大" },
          { name: "AI 消除", url: "https://www.miankoutupian.com/tools", desc: "图片处理" },
          { name: "Magic Eraser", url: "https://magiceraser.pro/zh/app", desc: "AI 去除" }
        ]
      },
      {
        category: "资源 / 工具",
        items: [
          { name: "工具大全", url: "https://www.zxmls.lol", desc: "工具导航" },
          { name: "破解 PDF", url: "https://www.ilovepdf.com/", desc: "PDF 工具" },
          { name: "黑科技", url: "https://iiihnsjn717.feishu.cn/wiki/L8n1wzMTJiuzS1k2W8dcfv7Dnlf", desc: "技巧合集" },
          { name: "找资源", url: "https://www.qnnav.com/#term-7259", desc: "资源搜索" },
          { name: "网盘不限速", url: "https://pd.fly288.top/user/parse", desc: "网盘解析" },
          { name: "电脑工具", url: "https://dnkh.mwks77.cn", desc: "电脑工具" },
          { name: "文件分享", url: "https://wormhole.app/", desc: "传文件" },
          { name: "适用工具", url: "https://ppmc.club/navhub", desc: "导航工具" },
          { name: "适用工具2", url: "https://huamao.vip/", desc: "工具集合" },
          { name: "适用工具3", url: "https://www.plnav.com/", desc: "导航站" },
          { name: "适用工具4", url: "https://www.dmjfup.com/", desc: "资源站" },
          { name: "适用工具5", url: "https://jiafangbb.com/", desc: "工具导航" }
        ]
      },
      {
        category: "游戏 / 模组",
        items: [
          { name: "付费游戏", url: "https://yzhouk.com/", desc: "游戏资源" },
          { name: "我的世界模组", url: "https://bbsmc.net/modpacks", desc: "MOD/整合包" },
          { name: "单机游戏", url: "https://gdgame.org/", desc: "单机资源" },
          { name: "单机游戏2", url: "https://www.xianyudanji.to/", desc: "单机资源" },
          { name: "SteamZG", url: "https://steamzg.com/", desc: "游戏站" },
          { name: "RV Game", url: "https://www.rvgame.icu/pc", desc: "PC 游戏" }
        ]
      },
      {
        category: "字幕 / 其他",
        items: [
          { name: "字幕", url: "https://zm.i8k.tv/", desc: "字幕站" },
          { name: "修复维修工具", url: "https://zh.ifixit.com/", desc: "维修教程" },
          { name: "测试 CPU 显卡", url: "https://pc-builds.com/zh", desc: "硬件测试" }
        ]
      },
      {
        category: "技术类（可自行调整）",
        items: [
          { name: "黑客渗透", url: "https://ycc77.cn/", desc: "技术站" },
          { name: "在线", url: "https://i.zkaq.cn/", desc: "技术站" },
          { name: "黑客装逼", url: "https://www.crucix.live/", desc: "技术站" }
        ]
      }
    ];

    const clickData = JSON.parse(localStorage.getItem("nav_clicks") || "{}");

    const allSites = data.flatMap(cat => cat.items.map(item => ({
      ...item,
      category: cat.category
    })));

    function getClicks(url){
      return clickData[url] || 0;
    }

    function setClicks(url){
      clickData[url] = (clickData[url] || 0) + 1;
      localStorage.setItem("nav_clicks", JSON.stringify(clickData));
      renderStats();
      renderHot();
    }

    function normalize(str){
      return (str || "").toLowerCase().replace(/\s+/g, "");
    }

    function renderStats(){
      document.getElementById("siteCount").textContent = allSites.length;
      const totalClicks = Object.values(clickData).reduce((a,b)=>a+b,0);
      document.getElementById("clickCount").textContent = totalClicks;
    }

    function renderHot(){
      const hot = [...allSites]
        .sort((a,b) => getClicks(b.url) - getClicks(a.url))
        .slice(0, 6);

      const hotGrid = document.getElementById("hotGrid");
      hotGrid.innerHTML = hot.map(item => `
        <div class="hot-card">
          <div class="hot-badge">🔥 热门 · ${getClicks(item.url)} 次点击</div>
          <a href="${item.url}" target="_blank" rel="noopener" onclick="recordClick('${item.url.replace(/'/g,"\\'")}')">${item.name}</a>
          <p>${item.desc || item.category}</p>
        </div>
      `).join("");
    }

    function renderCats(filter = ""){
      const catsEl = document.getElementById("cats");
      const keyword = normalize(filter);

      const filteredCats = data.map(cat => {
        const items = cat.items.filter(item => {
          const text = normalize(item.name + " " + item.url + " " + item.desc + " " + cat.category);
          return text.includes(keyword);
        });
        return { ...cat, items };
      }).filter(cat => cat.items.length > 0);

      catsEl.innerHTML = filteredCats.map(cat => `
        <div class="cat-card">
          <div class="cat-head">
            <h3 class="cat-title">${cat.category}</h3>
            <div class="count">${cat.items.length} 个资源</div>
          </div>
          <div class="card-list">
            ${cat.items.map(item => `
              <a class="site" href="${item.url}" target="_blank" rel="noopener" onclick="recordClick('${item.url.replace(/'/g,"\\'")}')">
                <div class="site-name">${item.name}</div>
                <div class="site-url">${item.url}</div>
                <small>点击访问 · ${getClicks(item.url)} 次</small>
              </a>
            `).join("")}
          </div>
        </div>
      `).join("");

      if (!filteredCats.length){
        catsEl.innerHTML = `<div class="cat-card" style="padding:24px;text-align:center;color:#94a3b8;">未找到相关资源</div>`;
      }
    }

    function recordClick(url){
      setClicks(url);
    }

    document.getElementById("searchInput").addEventListener("input", e => {
      renderCats(e.target.value);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      document.getElementById("searchInput").value = "";
      renderCats("");
    });

    renderStats();
    renderHot();
    renderCats("");
  </script>
</body>
</html>
